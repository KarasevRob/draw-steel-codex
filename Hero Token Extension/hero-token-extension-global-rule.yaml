        guid: 059c7cb2-64be-4774-a812-80971cbcd6f0
        name: Hero Token - Recover
        type: passive
        trigger: You start your turn or take damage.
        effect: Spend 2 Hero Tokens with no action required to regain Stamina equal to your Recovery Value. Start-of-turn use is prompted automatically. For damage-triggered use, activate the manual version before the damage is applied.
        target: Self
        cost: 2 Hero Tokens
        implementationNotes: The TriggeredAbility uses hasManualVersion so Codex owns the manual/triggered duality. Automatic pre-damage prompting remains disabled until the engine exposes a pre-damage trigger that guarantees damage will actually be applied.
